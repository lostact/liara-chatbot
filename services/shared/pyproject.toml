[project]
name = "shared"
version = "0.1.0"
description = "Shared schemas and settings for Liara Chatbot"
authors = [{ name = "AI Platform Team" }]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
]
requires-python = ">=3.11"
